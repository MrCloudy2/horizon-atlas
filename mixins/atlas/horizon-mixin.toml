[mod]
id = "atlas"
version = "0.2.0"
priority = 100

# Pinned: besides the native hook points it reads the window's world (chunks,
# block facts, light, entities, biomes), the game's map texture slots, the
# world folder and the connected server's address, none of which the stable
# hook points offer.
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

[[module]]
id = "core"
file = "crates/horizon-client/src/game.rs"
name = "atlas_mod"
source = "core.rs"

[[module]]
id = "bridge"
file = "crates/horizon-client/src/game.rs"
name = "atlas_bridge"
source = "bridge.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

